<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lovable Monitor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="title-row">
        <h1>🎨 Lovable Monitor</h1>
        <div class="status-badge" id="statusBadge">Inactive</div>
      </div>
      <p class="subtitle">Real-time Lovable project analysis</p>
    </div>

    <!-- Status Section -->
    <div class="section">
      <h2>Status</h2>
      <div class="status-info">
        <div class="info-row">
          <span class="label">Monitoring:</span>
          <span class="value" id="monitoringStatus">—</span>
        </div>
        <div class="info-row">
          <span class="label">Last Update:</span>
          <span class="value" id="lastUpdate">—</span>
        </div>
        <div class="info-row">
          <span class="label">Project:</span>
          <span class="value" id="projectUrl">—</span>
        </div>
      </div>
    </div>

    <!-- Current Analysis Section -->
    <div class="section" id="analysisSection" style="display: none;">
      <h2>Detected Components</h2>
      <div class="tags" id="components"></div>

      <h3>Aesthetic</h3>
      <div class="tags" id="aesthetic"></div>

      <h3>Layout</h3>
      <div class="info-row">
        <span class="label">Type:</span>
        <span class="value" id="layoutType">—</span>
      </div>

      <h3>Colors</h3>
      <div class="color-palette" id="colorPalette"></div>

      <h3>Fonts</h3>
      <div class="fonts" id="fonts"></div>
    </div>

    <!-- Controls Section -->
    <div class="section">
      <div class="button-group">
        <button id="startBtn" class="btn btn-primary">Start Monitoring</button>
        <button id="stopBtn" class="btn btn-secondary" disabled>Stop Monitoring</button>
      </div>
      <div class="button-group">
        <button id="screenshotBtn" class="btn btn-tertiary">Capture Screenshot</button>
        <button id="copyBtn" class="btn btn-tertiary">Copy Analysis</button>
      </div>
    </div>

    <!-- Send to Optimizer -->
    <div class="section">
      <button id="sendToOptimizerBtn" class="btn btn-success">
        📤 Send to Lovable Optimizer
      </button>
      <p class="hint">Shares current analysis with your Lovable Optimizer page</p>
    </div>

    <!-- Footer -->
    <div class="footer">
      <p>Made for smarter Lovable prompting</p>
      <a href="https://prompt-forge-ai-59.lovable.app/" target="_blank">Open Optimizer</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
