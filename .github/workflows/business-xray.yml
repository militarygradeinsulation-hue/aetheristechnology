name: Business X-Ray quality checks

on:
  push:
    paths:
      - 'apps/business-xray/**'
      - 'public/business-xray/**'
      - '.github/workflows/business-xray.yml'
  pull_request:
    paths:
      - 'apps/business-xray/**'
      - 'public/business-xray/**'
      - '.github/workflows/business-xray.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/business-xray
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unit and integration tests
        run: bun run test
      - name: Build production app
        run: bun run build
      - name: Check zero-cost public prototype
        run: |
          test -s ../../public/business-xray/index.html
          grep -q 'Aetheris | Business X-Ray' ../../public/business-xray/index.html
