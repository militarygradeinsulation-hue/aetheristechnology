name: Aetheris public build and assessment tests

on:
  pull_request:
    paths:
      - "src/pages/**"
      - "src/components/**"
      - "src/lib/**"
      - "supabase/functions/_shared/company-audit-offers.ts"
      - "supabase/functions/company-leak-audit/**"
      - "supabase/migrations/*private_golden*"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/aetheris-public-build.yml"
  push:
    branches: [main]
    paths:
      - "src/pages/**"
      - "src/components/**"
      - "src/lib/**"
      - "supabase/functions/_shared/company-audit-offers.ts"
      - "supabase/functions/company-leak-audit/**"
      - "supabase/migrations/*private_golden*"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/aetheris-public-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Check public-funnel invariants
        run: node .github/scripts/public-website-funnel-check.mjs
      - name: Test deterministic audit rules
        run: npx vitest run src/lib/companyAuditOffers.test.ts
      - name: Build production site
        run: npm run build
