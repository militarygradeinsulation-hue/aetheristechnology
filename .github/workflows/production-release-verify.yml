name: Production release verify

on:
  push:
    branches: [main]
    paths:
      - "public/release/executive-meeting-flow.json"
      - ".github/workflows/production-release-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for published release marker
        shell: bash
        run: |
          set -euo pipefail
          URL="https://aetheristechnology.lovable.app/release/executive-meeting-flow.json"
          EXPECTED='"version": "2026-10-20.1"'
          for attempt in $(seq 1 40); do
            body="$(curl -fsSL --max-time 20 "$URL" 2>/dev/null || true)"
            if printf '%s' "$body" | grep -Fq "$EXPECTED"; then
              echo "Production release marker verified on attempt $attempt."
              printf '%s\n' "$body"
              exit 0
            fi
            echo "Attempt $attempt/40: current production has not published the expected release marker yet."
            sleep 15
          done
          echo "Expected release marker did not appear in production within 10 minutes."
          exit 1

      - name: Verify meeting-flow edge auth boundary
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/meeting-flow-body -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            --data '{"action":"list"}' \
            'https://ihdjpxhcaiaixmqxyqoe.supabase.co/functions/v1/portal-meeting-flow')"
          cat /tmp/meeting-flow-body
          test "$code" = "401"
          grep -qi 'unauthorized' /tmp/meeting-flow-body
