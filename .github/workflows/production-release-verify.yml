name: Production release verify

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-release-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for executive meeting flow in production bundle
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN="https://aetheris.technology"
          NEEDLE="Executive Relationship-to-Close"

          for attempt in $(seq 1 40); do
            html="$(curl -fsSL --max-time 20 "$ORIGIN/" 2>/dev/null || true)"
            found=0

            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              case "$asset" in
                http*) url="$asset" ;;
                /*) url="$ORIGIN$asset" ;;
                *) url="$ORIGIN/$asset" ;;
              esac

              js="$(curl -fsSL --max-time 30 "$url" 2>/dev/null || true)"
              if printf '%s' "$js" | grep -Fq "$NEEDLE"; then
                echo "Production frontend verified on attempt $attempt via $url"
                found=1
                break
              fi
            done < <(printf '%s' "$html" | grep -oE 'src="[^"]+\.js[^"]*"' | sed -E 's/^src="//;s/"$//' | sort -u)

            if [ "$found" = "1" ]; then
              exit 0
            fi

            echo "Attempt $attempt/40: production bundle does not contain the executive meeting flow yet."
            sleep 15
          done

          echo "Executive meeting flow did not appear in production within 10 minutes."
          exit 1

      - name: Verify meeting-flow edge auth boundary
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/meeting-flow-body -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            --data '{"action":"list"}' \
            'https://ihdjpxhcaiaixmqxyqoe.supabase.co/functions/v1/portal-meeting-flow')"
          cat /tmp/meeting-flow-body
          test "$code" = "401"
          grep -qi 'unauthorized' /tmp/meeting-flow-body
