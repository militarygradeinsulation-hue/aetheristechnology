# Release verification: meeting-flow-visible-v2
name: Production release verify

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-release-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for executive meeting flow in production bundles
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN="https://aetheris.technology"
          NEEDLE_ONE="Executive Sales Process · New"
          NEEDLE_TWO="Open Executive Meeting Flow"

          find_in_live_bundles() {
            local html queue next seen asset url js refs
            html="$(curl -fsSL --max-time 20 "$ORIGIN/" 2>/dev/null || true)"
            queue="$(printf '%s' "$html" | grep -oE '(https?://[^" ]+\.js[^" ]*|/?assets/[A-Za-z0-9._-]+\.js)' | sed -E 's#^//#https://#' | sort -u || true)"
            seen=""

            for round in 1 2 3 4; do
              [ -n "$queue" ] || break
              next=""
              while IFS= read -r asset; do
                [ -n "$asset" ] || continue
                if printf '%s\n' "$seen" | grep -Fxq "$asset"; then
                  continue
                fi
                seen="$seen$asset"$'\n'

                case "$asset" in
                  http*) url="$asset" ;;
                  /*) url="$ORIGIN$asset" ;;
                  *) url="$ORIGIN/$asset" ;;
                esac

                js="$(curl -fsSL --max-time 30 "$url" 2>/dev/null || true)"
                if printf '%s' "$js" | grep -Fq "$NEEDLE_ONE" && printf '%s' "$js" | grep -Fq "$NEEDLE_TWO"; then
                  echo "Admin Meeting Flow callout verified in production via $url"
                  return 0
                fi

                refs="$(printf '%s' "$js" | grep -oE '/?assets/[A-Za-z0-9._-]+\.js' | sort -u || true)"
                if [ -n "$refs" ]; then
                  next="$next$refs"$'\n'
                fi
              done <<< "$queue"
              queue="$(printf '%s' "$next" | sed '/^$/d' | sort -u)"
            done
            return 1
          }

          for attempt in $(seq 1 40); do
            if find_in_live_bundles; then
              echo "Admin Meeting Flow callout is live in production on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt/40: production bundles do not contain the visible Admin Meeting Flow callout yet."
            sleep 15
          done

          echo "Visible Admin Meeting Flow callout did not appear in production within 10 minutes."
          exit 1

      - name: Verify meeting-flow edge auth boundary
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/meeting-flow-body -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            --data '{"action":"list"}' \
            'https://ihdjpxhcaiaixmqxyqoe.supabase.co/functions/v1/portal-meeting-flow')"
          cat /tmp/meeting-flow-body
          test "$code" = "401"
          grep -qi 'unauthorized' /tmp/meeting-flow-body
