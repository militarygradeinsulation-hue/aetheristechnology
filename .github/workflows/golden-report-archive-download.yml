name: Golden Report archive download integrity

on:
  pull_request:
    paths:
      - "src/components/GoldenReportLibrary.tsx"
      - "src/components/ForensicScanAllPanel.tsx"
      - "src/lib/goldenLibrary.ts"
      - "src/lib/generateForensicGoldenPdf.ts"
      - "src/lib/goldenReportArchiveDownload.test.ts"
      - "src/lib/goldenReportDownloadAvailability.ts"
      - "src/lib/goldenReportArchiveRecovery.test.ts"
      - "supabase/functions/_shared/golden-report-reconciliation.ts"
      - "supabase/functions/forensic-scan-all/index.ts"
      - "supabase/functions/golden-report-library/**"
      - ".github/workflows/golden-report-archive-download.yml"
  push:
    branches: [main]
    paths:
      - "src/components/GoldenReportLibrary.tsx"
      - "src/components/ForensicScanAllPanel.tsx"
      - "src/lib/goldenLibrary.ts"
      - "src/lib/generateForensicGoldenPdf.ts"
      - "src/lib/goldenReportArchiveDownload.test.ts"
      - "src/lib/goldenReportDownloadAvailability.ts"
      - "src/lib/goldenReportArchiveRecovery.test.ts"
      - "supabase/functions/_shared/golden-report-reconciliation.ts"
      - "supabase/functions/forensic-scan-all/index.ts"
      - "supabase/functions/golden-report-library/**"
      - ".github/workflows/golden-report-archive-download.yml"

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run Golden Report PDF regression tests
        run: bunx vitest run src/lib/goldenReportArchiveDownload.test.ts src/lib/goldenReportArchiveRecovery.test.ts src/lib/goldenReportParity.test.ts
      - name: Build main Aetheris website
        run: bun run build
