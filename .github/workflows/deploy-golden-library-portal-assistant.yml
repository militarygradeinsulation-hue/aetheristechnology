name: Deploy Golden Library and Portal Assistant

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/golden-report-library/**"
      - "supabase/functions/rep-assistant/**"
      - "supabase/functions/_shared/industry-intelligence.ts"
      - "supabase/functions/_shared/operator-tools.ts"
      - "supabase/functions/_shared/firecrawl-search-response.ts"
      - "supabase/functions/_shared/portal-assistant-policy.ts"
      - "supabase/config.toml"
      - ".github/workflows/deploy-golden-library-portal-assistant.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-golden-library-portal-assistant
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      SUPABASE_PROJECT_ID: ihdjpxhcaiaixmqxyqoe
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Verify authorized deployment credentials
        shell: bash
        run: |
          set -eu
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Supabase functions not deployed: SUPABASE_ACCESS_TOKEN secret is missing."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.108.0
      - name: Deploy authenticated Golden Library and Portal Assistant
        run: |
          supabase functions deploy golden-report-library --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy rep-assistant --project-ref "$SUPABASE_PROJECT_ID"
      - name: Verify unauthorized access is rejected
        shell: bash
        run: |
          set -eu
          for slug in golden-report-library rep-assistant; do
            code="$(curl --max-time 20 -sS -o /tmp/portal-unauthorized.json -w '%{http_code}' \
              -X POST -H 'Content-Type: application/json' \
              -d '{"action":"list_companies","messages":[]}' \
              "https://$SUPABASE_PROJECT_ID.supabase.co/functions/v1/$slug")"
            if [ "$code" != "401" ] && [ "$code" != "403" ]; then
              echo "::error::$slug returned unexpected unauthenticated status $code."
              exit 1
            fi
          done
          echo "Portal and library functions deployed; unauthenticated access rejected." >> "$GITHUB_STEP_SUMMARY"
