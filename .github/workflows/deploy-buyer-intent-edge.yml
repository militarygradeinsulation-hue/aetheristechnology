name: Deploy Buyer Intent Radar edge function

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/owner-buyer-intent/**"
      - "supabase/functions/_shared/buyer-intent-core.ts"
      - "supabase/functions/_shared/owner-token.ts"
      - "supabase/config.toml"
      - ".github/workflows/deploy-buyer-intent-edge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-buyer-intent-edge
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Confirm Supabase deployment credential
        id: auth
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping edge deployment: SUPABASE_ACCESS_TOKEN is not configured."
          fi
      - uses: actions/checkout@v4
        if: steps.auth.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v3.0.1
        if: steps.auth.outputs.enabled == 'true'
        with:
          version: 2.108.0
      - name: Deploy only Buyer Intent Radar, not unrelated edge functions
        if: steps.auth.outputs.enabled == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy owner-buyer-intent --project-ref ihdjpxhcaiaixmqxyqoe
      - name: Verify unauthenticated requests are rejected
        if: steps.auth.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 20 -o /tmp/buyer-intent-auth.txt -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            -d '{"action":"get"}' \
            'https://ihdjpxhcaiaixmqxyqoe.supabase.co/functions/v1/owner-buyer-intent')"
          test "$code" = "403"
          grep -qi 'owner session required' /tmp/buyer-intent-auth.txt
