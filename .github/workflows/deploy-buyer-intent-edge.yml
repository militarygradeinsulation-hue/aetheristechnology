name: Deploy Buyer Intent Radar edge function

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/owner-buyer-intent/**"
      - "supabase/functions/_shared/buyer-intent-core.ts"
      - "supabase/functions/_shared/owner-token.ts"
      - "supabase/config.toml"
      - ".github/workflows/deploy-buyer-intent-edge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-buyer-intent-edge
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require Supabase deployment credential
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Buyer Intent Radar backend NOT deployed. Add SUPABASE_ACCESS_TOKEN in repository Actions secrets and rerun."
            {
              echo "## Buyer Intent Radar deployment blocked"
              echo "GitHub Actions secret SUPABASE_ACCESS_TOKEN is missing."
              echo "Add a Supabase personal access token authorized for project ihdjpxhcaiaixmqxyqoe, then rerun this workflow."
              echo "Until this deployment succeeds, the owner dashboard cannot perform live scans."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Supabase deployment credential configured."
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.108.0
      - name: Deploy only Buyer Intent Radar, not unrelated edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy owner-buyer-intent --project-ref ihdjpxhcaiaixmqxyqoe
      - name: Verify unauthenticated requests are rejected
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 20 -o /tmp/buyer-intent-auth.txt -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            -d '{"action":"get"}' \
            'https://ihdjpxhcaiaixmqxyqoe.supabase.co/functions/v1/owner-buyer-intent')"
          test "$code" = "403"
          grep -qi 'owner session required' /tmp/buyer-intent-auth.txt
