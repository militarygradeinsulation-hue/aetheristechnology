name: Golden Report friction intelligence checks

on:
  pull_request:
    paths:
      - 'src/components/GoldenFrictionIntelligence.tsx'
      - 'src/components/ForensicScanAllPanel.tsx'
      - 'src/lib/goldenFrictionIntelligence.test.ts'
      - 'supabase/functions/_shared/golden-friction-intelligence.ts'
      - 'supabase/functions/_shared/golden-report-model.ts'
      - '.github/workflows/golden-friction-intelligence.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/GoldenFrictionIntelligence.tsx'
      - 'src/components/ForensicScanAllPanel.tsx'
      - 'src/lib/goldenFrictionIntelligence.test.ts'
      - 'supabase/functions/_shared/golden-friction-intelligence.ts'
      - 'supabase/functions/_shared/golden-report-model.ts'
      - '.github/workflows/golden-friction-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run friction model and report parity tests
        run: bunx vitest run src/lib/goldenFrictionIntelligence.test.ts src/lib/goldenReportParity.test.ts src/lib/goldenExecutiveProfile.test.ts src/lib/businessXray.test.ts
      - name: Check production build
        run: bun run build
      - name: Check standalone Golden Report build
        run: bun run build:golden-standalone
