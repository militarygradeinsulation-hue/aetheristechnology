name: Golden Report friction intelligence checks

on:
  pull_request:
    paths:
      - 'src/components/GoldenFrictionIntelligence.tsx'
      - 'src/components/GoldenFrictionWorkspace.tsx'
      - 'src/components/ForensicScanAllPanel.tsx'
      - 'src/lib/goldenFrictionIntelligence.test.ts'
      - 'src/lib/goldenActiveFriction.test.ts'
      - 'src/lib/goldenFrictionPresentation.test.ts'
      - 'src/lib/goldenMissingTriangulation.test.ts'
      - 'src/lib/goldenCrmReconciliation.ts'
      - 'src/lib/goldenCrmReconciliation.test.ts'
      - 'src/components/GoldenCrmCsvPreview.tsx'
      - 'src/components/GoldenTriangulationEvidenceReview.tsx'
      - 'src/lib/goldenTriangulationReview.test.ts'
      - 'supabase/functions/_shared/golden-triangulation-review.ts'
      - 'supabase/functions/golden-triangulation-review/index.ts'
      - 'src/components/GoldenMissingTriangulation.tsx'
      - 'supabase/functions/_shared/golden-missing-triangulation.ts'
      - 'src/lib/goldenFrictionPresentation.ts'
      - 'supabase/functions/_shared/golden-friction-intelligence.ts'
      - 'supabase/functions/_shared/golden-friction-scan.ts'
      - 'supabase/functions/_shared/golden-report-model.ts'
      - 'supabase/functions/forensic-scan-all/index.ts'
      - 'supabase/functions/golden-friction-workspace/index.ts'
      - 'supabase/migrations/*golden_friction_experiments.sql'
      - '.github/workflows/golden-friction-intelligence.yml'
      - 'src/lib/goldenScopedCrm.ts'
      - 'src/lib/goldenScopedCrm.test.ts'
      - 'src/components/GoldenScopedCrmPreview.tsx'
      - 'supabase/functions/_shared/golden-scoped-crm.ts'
      - 'supabase/functions/golden-scoped-crm-preview/index.ts'
      - 'supabase/config.toml'
  push:
    branches: [main]
    paths:
      - 'src/components/GoldenFrictionIntelligence.tsx'
      - 'src/components/GoldenFrictionWorkspace.tsx'
      - 'src/components/ForensicScanAllPanel.tsx'
      - 'src/lib/goldenFrictionIntelligence.test.ts'
      - 'src/lib/goldenActiveFriction.test.ts'
      - 'src/lib/goldenFrictionPresentation.test.ts'
      - 'src/lib/goldenMissingTriangulation.test.ts'
      - 'src/lib/goldenCrmReconciliation.ts'
      - 'src/lib/goldenCrmReconciliation.test.ts'
      - 'src/components/GoldenCrmCsvPreview.tsx'
      - 'src/components/GoldenTriangulationEvidenceReview.tsx'
      - 'src/lib/goldenTriangulationReview.test.ts'
      - 'supabase/functions/_shared/golden-triangulation-review.ts'
      - 'supabase/functions/golden-triangulation-review/index.ts'
      - 'src/components/GoldenMissingTriangulation.tsx'
      - 'supabase/functions/_shared/golden-missing-triangulation.ts'
      - 'src/lib/goldenFrictionPresentation.ts'
      - 'supabase/functions/_shared/golden-friction-intelligence.ts'
      - 'supabase/functions/_shared/golden-friction-scan.ts'
      - 'supabase/functions/_shared/golden-report-model.ts'
      - 'supabase/functions/forensic-scan-all/index.ts'
      - 'supabase/functions/golden-friction-workspace/index.ts'
      - 'supabase/migrations/*golden_friction_experiments.sql'
      - '.github/workflows/golden-friction-intelligence.yml'
      - 'src/lib/goldenScopedCrm.ts'
      - 'src/lib/goldenScopedCrm.test.ts'
      - 'src/components/GoldenScopedCrmPreview.tsx'
      - 'supabase/functions/_shared/golden-scoped-crm.ts'
      - 'supabase/functions/golden-scoped-crm-preview/index.ts'
      - 'supabase/config.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run friction models and report parity tests
        run: bunx vitest run src/lib/goldenFrictionIntelligence.test.ts src/lib/goldenActiveFriction.test.ts src/lib/goldenFrictionPresentation.test.ts src/lib/goldenMissingTriangulation.test.ts src/lib/goldenCrmReconciliation.test.ts src/lib/goldenTriangulationReview.test.ts src/lib/goldenScopedCrm.test.ts src/lib/goldenReportParity.test.ts src/lib/goldenExecutiveProfile.test.ts src/lib/businessXray.test.ts
      - name: Check production build
        run: bun run build
      - name: Check standalone Golden Report build
        run: bun run build:golden-standalone
