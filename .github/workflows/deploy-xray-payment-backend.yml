name: Deploy Business X-Ray payment backend (owner-approved)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY-XRAY-BACKEND to deploy payment/scan/email functions to existing Aetheris Supabase'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.inputs.confirmation == 'DEPLOY-XRAY-BACKEND' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ihdjpxhcaiaixmqxyqoe
    steps:
      - name: Check out tested source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Refuse unauthorized or wrong-project deployment
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN repository secret. Obtain an authorized token from the owner of ihdjpxhcaiaixmqxyqoe and add it in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ "$SUPABASE_PROJECT_ID" != "ihdjpxhcaiaixmqxyqoe" ]; then
            echo "::error::Refusing to deploy to the wrong project."
            exit 1
          fi
      - name: Install official Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify Supabase CLI deployment options
        run: supabase functions deploy --help
      - name: Deploy fixed-price Stripe checkout
        run: supabase functions deploy create-checkout --project-ref "$SUPABASE_PROJECT_ID"
      - name: Deploy verified Stripe webhook fulfillment
        run: supabase functions deploy payments-webhook --project-ref "$SUPABASE_PROJECT_ID"
      - name: Deploy public website scanner safeguards
        run: supabase functions deploy scan-website --project-ref "$SUPABASE_PROJECT_ID"
      - name: Deploy internal paid report generator and email template
        run: supabase functions deploy generate-purchase-delivery --project-ref "$SUPABASE_PROJECT_ID"
      - name: Deployment note
        run: |
          echo "Edge source was deployed to the existing Aetheris project."
          echo "THIS IS NOT PROOF OF A COMPLETED PURCHASE OR REPORT DELIVERY."
          echo "Test sandbox signed checkout, paid webhook, worker, email and failure cases."
          echo "Keep VITE_XRAY_WEBSITE_REPORT_CHECKOUT_ENABLED off until tests pass."
