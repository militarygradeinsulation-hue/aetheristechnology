name: Deploy Aetheris Social Content Scanner

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/generate-social-content/**"
      - "supabase/functions/_shared/social-content-source.ts"
      - "supabase/functions/_shared/social-content-loader.ts"
      - "supabase/functions/_shared/social-content-*.test.ts"
      - ".github/workflows/deploy-social-content-scanner.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-social-content-scanner
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Test social scanner evidence and provider behavior
        run: bunx vitest run supabase/functions/_shared/social-content-source.test.ts supabase/functions/_shared/social-content-loader.test.ts

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      SUPABASE_PROJECT_ID: ihdjpxhcaiaixmqxyqoe
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Require backend deploy credentials
        shell: bash
        run: |
          set -eu
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Social scanner not deployed: missing SUPABASE_ACCESS_TOKEN secret."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.108.0
      - name: Deploy only generate-social-content
        run: supabase functions deploy generate-social-content --project-ref "$SUPABASE_PROJECT_ID"
      - name: Verify deployed function responds to CORS preflight
        shell: bash
        run: |
          set -eu
          status="$(curl -sS --max-time 20 -o /tmp/social-scan-options.txt -w '%{http_code}' \
            -X OPTIONS -H 'Origin: https://aetheris.technology' \
            -H 'Access-Control-Request-Method: POST' \
            "https://$SUPABASE_PROJECT_ID.supabase.co/functions/v1/generate-social-content")"
          case "$status" in
            2*) echo "Social content scanner deployed and preflight successful." >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::error::Social scanner preflight returned HTTP $status"; exit 1 ;;
          esac
      - name: Verify latest backend handles invalid input without paid provider calls
        shell: bash
        run: |
          set -eu
          status="$(curl -sS --max-time 20 -o /tmp/social-scan-invalid.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            -d '{"url":""}' \
            "https://$SUPABASE_PROJECT_ID.supabase.co/functions/v1/generate-social-content")"
          test "$status" = "400"
          grep -q '"code":"INVALID_URL"' /tmp/social-scan-invalid.json
          echo "Latest deployed function returned validated INVALID_URL response." >> "$GITHUB_STEP_SUMMARY"
