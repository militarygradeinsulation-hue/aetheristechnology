name: Deploy bounded Aetheris contact discovery

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/admin-scrape-leads-cron/**"
      - "supabase/functions/admin-scrape-leads/**"
      - "supabase/functions/portal-scrape-leads/**"
      - "supabase/functions/_shared/lead-enrichment.ts"
      - "supabase/functions/_shared/contact-discovery.ts"
      - "supabase/functions/_shared/contact-discovery.test.ts"
      - "supabase/functions/_shared/lead-enrichment.test.ts"
      - "supabase/functions/portal-rocketreach/**"
      - "supabase/functions/detective-prep/**"
      - "supabase/functions/extension-contacts/**"
      - "src/lib/portalLeads.ts"
      - "src/components/portal/LeadsBoard.tsx"
      - "extension/sidepanel.js"
      - "supabase/config.toml"
      - ".github/workflows/deploy-firecrawl-guards.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-firecrawl-guards
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Verify contact discovery and manual enrichment budgets
        run: bunx vitest run supabase/functions/_shared/contact-discovery.test.ts supabase/functions/_shared/lead-enrichment.test.ts
      - name: Verify application build
        run: bun run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      SUPABASE_PROJECT_ID: ihdjpxhcaiaixmqxyqoe
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Require existing deployment credentials
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Cannot deploy Firecrawl guards without SUPABASE_ACCESS_TOKEN."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.108.0
      - name: Deploy six contact and lead discovery functions
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy admin-scrape-leads-cron --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy admin-scrape-leads --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy portal-scrape-leads --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy portal-rocketreach --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy detective-prep --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy extension-contacts --project-ref "$SUPABASE_PROJECT_ID"
      - name: Verify manual scrapers still reject unauthenticated requests
        shell: bash
        run: |
          set -euo pipefail
          for function_name in admin-scrape-leads portal-scrape-leads portal-rocketreach detective-prep; do
            status="$(curl -sS --max-time 20 -o /tmp/firecrawl-unauthorized.json -w '%{http_code}' \
              -X POST -H 'Content-Type: application/json' -d '{}' \
              "https://$SUPABASE_PROJECT_ID.supabase.co/functions/v1/$function_name")"
            if [ "$status" != "401" ]; then
              echo "::error::$function_name returned HTTP $status; expected 401."
              exit 1
            fi
          done
          echo "All protected manual and deep-scan endpoints reject missing credentials." >> "$GITHUB_STEP_SUMMARY"
