name: Deploy scanned leads admin directory API

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/admin-data/**"
      - "supabase/functions/_shared/scanned-leads-directory.ts"
      - "supabase/functions/_shared/scanned-leads-directory.test.ts"
      - ".github/workflows/deploy-scanned-leads-admin.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-scanned-leads-admin
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Check saved scan evidence normalization
        run: bunx vitest run supabase/functions/_shared/scanned-leads-directory.test.ts

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      SUPABASE_PROJECT_ID: ihdjpxhcaiaixmqxyqoe
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Verify deploy credentials
        shell: bash
        run: |
          set -eu
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN; no admin-data deployment occurred."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.108.0
      - name: Deploy existing admin-data function only
        run: supabase functions deploy admin-data --project-ref "$SUPABASE_PROJECT_ID"
      - name: Verify admin data denies unauthenticated queries
        shell: bash
        run: |
          set -eu
          status="$(curl -sS --max-time 20 -o /tmp/scanned-leads-admin-auth.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            -d '{"action":"scanned_leads_directory","source":"forensic"}' \
            "https://$SUPABASE_PROJECT_ID.supabase.co/functions/v1/admin-data")"
          if [ "$status" != "401" ] && [ "$status" != "403" ]; then
            echo "::error::Admin directory unexpectedly returned HTTP $status without credentials."
            exit 1
          fi
          echo "Admin scanned leads API deployment passed unauthenticated-access test." >> "$GITHUB_STEP_SUMMARY"
