name: Deploy Golden Report finalization repair

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/forensic-scan-all/**"
      - "supabase/functions/_shared/golden-compiler.ts"
      - ".github/workflows/deploy-golden-report-finalization.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-golden-report-finalization
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      SUPABASE_PROJECT_ID: ihdjpxhcaiaixmqxyqoe
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Require authorized Aetheris backend deployment credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Golden Report backend NOT deployed. Missing repository secret SUPABASE_ACCESS_TOKEN."
            echo "## Golden Report finalization deployment blocked" >> "$GITHUB_STEP_SUMMARY"
            echo "Add SUPABASE_ACCESS_TOKEN authorized for project ihdjpxhcaiaixmqxyqoe. No changes were made to the live Edge Function." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          test "$SUPABASE_PROJECT_ID" = "ihdjpxhcaiaixmqxyqoe"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.108.0
      - name: Deploy only Golden Report orchestrator and isolated finalizer
        run: supabase functions deploy forensic-scan-all --project-ref "$SUPABASE_PROJECT_ID"
      - name: Verify function HTTP endpoint responds without exposing private scans
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 20 -o /tmp/golden-finalizer-health.txt -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d '{"action":"finalize","scan_id":"123cacba-15f3-47a3-af4c-8f55df511cfd"}' \
            "https://$SUPABASE_PROJECT_ID.supabase.co/functions/v1/forensic-scan-all")"
          test "$code" = "403"
          grep -qi 'unauthorized' /tmp/golden-finalizer-health.txt
          echo "Golden Report finalizer deployed; unauthenticated recovery blocked. No paid scan started." >> "$GITHUB_STEP_SUMMARY"
