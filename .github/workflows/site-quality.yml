name: Site quality

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/site-quality.yml"
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/site-quality.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install exact locked dependencies
        run: bun install --frozen-lockfile
      - name: Test executive meeting flow
        run: bunx vitest run src/lib/executiveMeetingFlow.test.ts src/lib/buyerIntentCore.test.ts src/lib/businessXrayPayments.test.ts src/lib/aetherisDirectEmail.test.ts src/lib/xraySelfServe.test.ts
      - name: Build website
        run: bun run build
